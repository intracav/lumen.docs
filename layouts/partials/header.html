<header class="site-header">
  <div class="header-inner">
    <button class="icon-btn mobile-menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      {{ partial "icon.html" "menu" }}
    </button>

    <a href="/" class="logo" aria-label="Lumen Docs home">
      <span class="logo-mark">{{ partial "icon.html" "lumen" }}</span>
      <span class="logo-text">Lumen<span>Docs</span></span>
    </a>

    <nav class="header-nav" aria-label="Primary">
      {{- $section := "" }}{{ with .FirstSection }}{{ $section = .RelPermalink }}{{ end }}
      {{- range .Site.Menus.main }}
      <a href="{{ .URL }}"{{ if eq .URL $section }} class="active" aria-current="true"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>

    <button class="search-trigger" type="button" data-search-open aria-label="Search the docs">
      {{ partial "icon.html" "search" }}
      <span class="label">Search docs</span>
      <kbd data-kbd-mod>⌘K</kbd>
    </button>

    <button class="icon-btn theme-toggle" type="button" aria-label="Switch between light and dark theme">
      {{ partial "icon.html" (dict "name" "moon" "class" "moon") }}
      {{ partial "icon.html" (dict "name" "sun" "class" "sun") }}
    </button>

    <a class="btn btn-primary btn-sm header-cta" href="{{ site.Params.appURL }}" rel="noopener">Open Lumen {{ partial "icon.html" "arrow-up-right" }}</a>
  </div>
</header>
