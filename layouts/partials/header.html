<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo">
      <span class="logo-wordmark"><span class="intra">Intra</span><span class="cav">cav</span></span>
      <span class="logo-sub">Lumen Docs</span>
    </a>

    <nav class="header-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>

    <a class="header-search" href="/search/" aria-label="Search the docs">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="header-search-label">Search</span>
    </a>

    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark mode">
      <span class="theme-icon">&#9789;</span>
    </button>

    <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>
  </div>
</header>
