{{- .Inner -}}
<div class="tabs">
<div class="tabs-nav" role="tablist">
{{- range $i, $t := .Store.Get "tabs" }}
<button class="tab-btn" type="button" role="tab" aria-selected="{{ if not $i }}true{{ else }}false{{ end }}"{{ if $i }} tabindex="-1"{{ end }} data-tab-index="{{ $i }}">{{ $t.name }}</button>
{{- end }}
</div>
{{- range $i, $t := .Store.Get "tabs" }}
<div class="tab-panel{{ if not $i }} active{{ end }}" role="tabpanel" data-tab-index="{{ $i }}">{{ $t.content }}</div>
{{- end }}
</div>
