baseURL = 'https://docs.intracav.ai/'
languageCode = 'en-us'
title = 'Lumen Docs'
enableGitInfo = true
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[frontmatter]
  date = [':git', 'date', 'publishDate']
  lastmod = [':git', 'lastmod', 'date']

[params]
  description = 'Learn Lumen, the clinical AI assistant by Intracav — drug interactions, medical coding, clinical notes, evidence search, and team knowledge, explained step by step.'
  tagline = 'The Clinical AI Assistant by Intracav'
  ogImage = '/img/og-default.png'
  primaryColor = '#BB5C4D'
  darkBg = '#161514'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5

[outputs]
  home = ['html', 'rss']
  section = ['html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.main]]
    name = 'Getting Started'
    url = '/getting-started/'
    weight = 1
  [[menu.main]]
    name = 'Guides'
    url = '/guides/'
    weight = 2
  [[menu.main]]
    name = 'Learn'
    url = '/learn/'
    weight = 3
  [[menu.main]]
    name = 'For Organizations'
    url = '/organizations/'
    weight = 4
  [[menu.main]]
    name = 'Developers'
    url = '/developers/'
    weight = 5
  [[menu.main]]
    name = 'Plans'
    url = '/plans/'
    weight = 6
