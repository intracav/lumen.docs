baseURL = 'https://docs.intracav.ai/'
languageCode = 'en-us'
title = 'Lumen Docs'
enableGitInfo = true
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[frontmatter]
  date = [':git', 'date', 'publishDate']
  lastmod = [':git', 'lastmod', 'date']

[params]
  description = 'Learn Lumen, the clinical AI assistant by Intracav — drug interactions, medical coding, clinical notes, evidence search, and team knowledge, explained step by step.'
  tagline = 'The Clinical AI Assistant by Intracav'
  ogImage = '/img/og-default.png'
  primaryColor = '#BB5C4D'
  darkBg = '#1B1A19'
  appURL = 'https://lumen.intracav.ai'
  magicafURL = 'https://magicaf.intracav.ai'
  # Sidebar groups, in order. Each section's _index.md sets `group` (cascaded
  # pages inherit nothing from it — the sidebar reads it from the section).
  [[params.sidebarGroups]]
    key = 'start'
    label = 'Start here'
  [[params.sidebarGroups]]
    key = 'use'
    label = 'Use Lumen'
  [[params.sidebarGroups]]
    key = 'create'
    label = 'Teach, research & create'
  [[params.sidebarGroups]]
    key = 'org'
    label = 'For organizations'
  [[params.sidebarGroups]]
    key = 'dev'
    label = 'Developers'
  [[params.sidebarGroups]]
    key = 'more'
    label = 'Reference'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5

[outputFormats]
  [outputFormats.llms]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['html', 'rss', 'llms']
  section = ['html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.goldmark.parser.attribute]
      block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.main]]
    name = 'Get started'
    url = '/getting-started/'
    weight = 1
  [[menu.main]]
    name = 'Guides'
    url = '/guides/'
    weight = 2
  [[menu.main]]
    name = 'Organizations'
    url = '/organizations/'
    weight = 3
  [[menu.main]]
    name = 'Developers'
    url = '/developers/'
    weight = 4
  [[menu.main]]
    name = 'Help'
    url = '/help/'
    weight = 5
